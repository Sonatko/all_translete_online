name: Build & Publish Standalone Portable Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Portable Release Package
        run: |
          python scripts/build_release.py --name "Translation_Ecosystem_Windows_Portable.zip"

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Translation_Ecosystem_Windows_Portable.zip
          draft: false
          prerelease: false
          generate_release_notes: true
